   if (doc && doc.activeElement === this._gateEl) { this._gateFocused = true; return; }\n      if (n > 0) this.tf = setTimeout(() => tryFocus(n - 1), 90);\n    };\n    tryFocus(12);\n  };\n\n  focusGate() { this._gateFocused = false; if (this._gateEl) this.gateRefCb(this._gateEl); }\n\n  componentDidUpdate(prevProps, prevState) {\n    if (this.state.gated && !prevState.gated) this.focusGate();\n  }\n\n  gateReply(msg, echo, hold) {\n    this.setState({ gateStage: 'reply', gateMsg: msg, gateEcho: echo });\n    this.t1 = setTimeout(() => {\n      try { sessionStorage.setItem('gate_cleared_this_session', 'true'); } catch (err) {}\n      this.setState({ gated: false, gateStage: 'ask' });\n    }, hold);\n  }\n\n  submitGate = () => {\n    const raw = (this.state.gateInput || '').trim();\n    if (!raw) return;\n    const key = raw.toLowerCase().replace(/[^a-z0-9]/g, '');\n    const hit = this.employers.find(e => e.match.some(m => key.indexOf(m) >= 0 || (key.length >= 3 && m.indexOf(key) >= 0)));\n    this.gateReply(hit ? hit.msg : this.genericMsg, raw, hit ? 1900 : 2400);\n  };\n\n  justBrowsing = () => { this.gateReply(this.genericMsg, 'Just browsing', 1800); };\n\n  componentDidMount() {\n    let cleared = false;\n    try {\n      localStorage.removeItem('ik-gate-cleared');\n      sessionStorage.removeItem('ik-gate-cleared');\n      cleared = sessionStorage.getItem('gate_cleared_this_session') === 'true';\n    } catch (err) {}\n    this._gateFocused = false;\n    this.setState({ gated: !cleared });\n    if (!cleared) this.focusGate();\n    this.onKey = (e) => {\n      if (this.state.gated) return;\n      if (e.key === 'Escape') { this.setState({ plain: false, menuOpen: false }); return; }\n      if (this.state.plain) return;\n      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); this.step(1); }\n      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); this.step(-1); }\n    };\n    window.addEventListener('keydown', this.onKey);\n    this.onResize = () => {\n      const wide = window.innerWidth >= 1100;\n      if (wide !== this.state.wide) this.setState({ wide, navOpen: wide ? this.state.navOpen : true });\n    };\n    window.addEventListener('resize', this.onResize);\n    this.onResize();\n    const land = this.props.landOn || '';\n    if (land.indexOf('Financial') === 0) this.jump(this.firstOf(1));\n  }\n\n  componentWillUnmount() {\n    clearTimeout(this.t1);\n    clearTimeout(this.t2);\n    window.removeEventListener('keydown', this.onKey);\n    window.removeEventListener('resize', this.onResize);\n  }\n\n  renderVals() {\n    const flat = this.flat();\n    const i = Math.max(0, Math.min(flat.length - 1, this.state.i));\n    const cur = flat[i];\n    const proj = this.projects[cur.p];\n    const total = proj.slides.length;\n    const instant = (this.props.slideTransition || 'Slide') === 'Instant';\n    const ink = (this.props.chatSurface || 'Ink') === 'Ink';\n    const wide = this.state.wide;\n    const gap = 'clamp(10px, 1vw, 16px)';\n    const navOpen = this.state.navOpen;\n    const gated = this.state.gated;\n    const veil = {\n      filter: gated ? 'blur(3.5px)' : 'none',\n      opacity: gated ? 0.45 : 1,\n      pointerEvents: gated ? 'none' : 'auto',\n      userSelect: gated ? 'none' : 'auto',\n      transition: 'filter .6s ease, opacity .6s ease'\n    };\n\n    const works = this.projects.map((p, pi) => {\n      const active = pi === cur.p;\n      return {\n        num: p.num,\n        title: p.title,\n        meta: (p.status ? p.status + ' · ' : '') + p.slides.length + ' slides',\n        go: () => this.jump(this.firstOf(pi)),\n        rowStyle: {\n          textAlign: 'left', padding: '12px 13px', borderRadius: '10px',\n          background: active ? 'oklch(0.33 0.02 265)' : 'transparent',\n          border: '1px solid ' + (active ? 'oklch(0.41 0.02 265)' : 'transparent'),\n          flex: wide ? '0 0 auto' : '0 0 200px',\n          boxShadow: active ? 'inset 2px 0 0 oklch(0.68 0.14 255)' : 'none',\n          color: active ? 'oklch(0.97 0.005 265)' : 'oklch(0.72 0.012 265)',\n          transition: 'background .18s ease, color .18s ease'\n        },\n        railStyle: {\n          width: '26px', height: '26px', borderRadius: '8px',\n          font: \"500 9.5px/1 'IBM Plex Mono', monospace\", letterSpacing: '.06em',\n          display: 'flex', alignItems: 'center', justifyContent: 'center',\n          background: active ? 'oklch(0.97 0.005 265)' : 'transparent',\n          border: '1px solid ' + (active ? 'oklch(0.97 0.005 265)' : 'oklch(0.42 0.02 265)'),\n          color: active ? 'oklch(0.24 0.015 265)' : 'oklch(0.74 0.012 265)',\n          transition: 'all .16s ease'\n        }\n      };\n    });\n\n    const dots = proj.slides.map((label, si) => {\n      const on = si === cur.s;\n      const past = si < cur.s;\n      return {\n        label,\n        go: () => this.jump(this.firstOf(cur.p) + si),\n        dotStyle: {\n          width: on ? '7px' : '5px', height: on ? '7px' : '5px', borderRadius: '50%', flex: '0 0 auto',\n          background: on ? 'oklch(0.7 0.14 255)' : (past ? 'oklch(0.6 0.012 265)' : 'oklch(0.42 0.02 265)'),\n          transition: 'all .18s ease'\n        },\n        labelStyle: {\n          fontSize: '12.5px', lineHeight: 1.3,\n          color: on ? 'oklch(0.97 0.005 265)' : 'oklch(0.68 0.012 265)',\n          fontWeight: on ? 500 : 400\n        }\n      };\n    });\n\n    const pill = (on) => ({\n      fontSize: '12.5px', padding: '8px 15px', borderRadius: '20px',\n      border: '1px solid ' + (on ? 'oklch(0.24 0.012 70)' : 'oklch(0.89 0.008 80)'),\n      background: on ? 'oklch(0.24 0.012 70)' : 'transparent',\n      color: on ? 'oklch(0.98 0.004 85)' : 'oklch(0.4 0.012 70)',\n      transition: 'all .16s ease'\n    });\n\n    return {\n      works, dots, wide,\n      shellStyle: {\n        display: 'flex', padding: 'clamp(10px, 1.4vw, 22px)', background: 'oklch(0.955 0.008 85)',\n er: 'Slide ' + (cur.s + 1) + ' of ' + total,\n      slideLabel: proj.num + ' · ' + proj.slides[cur.s],\n      trackStyle: {\n        display: 'flex', height: '100%', width: '100%',\n        transform: 'translate3d(-' + (i * 100) + '%, 0, 0)',\n        transition: instant ? 'none' : 'transform .52s cubic-bezier(.22,.61,.36,1)'\n      },\n      progressStyle: {\n        position: 'absolute', inset: '0 auto 0 0', display: 'block', borderRadius: '2px',\n        width: ((cur.s + 1) / total * 100) + '%',\n        background: 'oklch(0.55 0.14 255)', transition: 'width .4s cubic-bezier(.22,.61,.36,1)'\n      },\n      chatPanel: {\n        flex: wide ? '0 1 336px' : '0 0 auto',\n        minWidth: wide ? '284px' : 0, width: '100%',\n        marginLeft: 0, order: !wide && gated ? -1 : 0,\n        display: 'flex', flexDirection: 'column',\n        minHeight: 0, overflowY: 'auto', borderRadius: '14px',\n        padding: 'clamp(16px, 1.4vw, 22px)',\n        background: ink ? 'oklch(0.255 0.016 265)' : 'oklch(0.995 0.003 85)',\n        border: '1px solid ' + (ink ? 'oklch(0.31 0.02 265)' : 'oklch(0.9 0.008 80)'),\n        color: ink ? 'oklch(0.94 0.008 265)' : 'oklch(0.26 0.012 70)'\n      },\n      prev: () => this.step(-1),\n      next: () => this.step(1),\n      goFraud: () => { this.jump(this.firstOf(0)); this.setState({ view: 'menu' }); },\n      goDash: () => { this.jump(this.firstOf(1)); this.setState({ view: 'menu' }); },\n      onTouchStart: (e) => { this.tx = e.touches[0].clientX; this.ty = e.touches[0].clientY; },\n      onTouchEnd: (e) => {\n        if (this.tx == null) return;\n        const dx = e.changedTouches[0].clientX - this.tx;\n        const dy = e.changedTouches[0].clientY - this.ty;\n        if (Math.abs(dx) > 52 && Math.abs(dx) > Math.abs(dy) * 1.4) this.step(dx < 0 ? 1 : -1);\n        this.tx = null;\n      },\n      isMenu: !this.state.gated && this.state.view === 'menu',\n      isWorks: !this.state.gated && this.state.view === 'works',\n      isAbout: !this.state.gated && this.state.view === 'about',\n      showMenu: () => this.setState({ view: 'menu' }),\n      showWorks: () => this.setState({ view: 'works' }),\n      showAbout: () => this.setState({ view: 'about' }),\n      menuOpen: this.state.menuOpen,\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      replayGate: () => {\n        try { sessionStorage.removeItem('gate_cleared_this_session'); } catch (err) {}\n        clearTimeout(this.t1);\n        this._gateFocused = false;\n        this.focusGate();\n        this.setState({ menuOpen: false, gated: true, gateStage: 'ask', gateMsg: '', gateEcho: '', gateInput: '' });\n      },\n      gated: this.state.gated,\n      gateAsk: this.state.gated && this.state.gateStage === 'ask',\n      gateReplied: this.state.gated && this.state.gateStage === 'reply',\n      gateMsg: this.state.gateMsg,\n      gateEcho: this.state.gateEcho,\n      gateInput: this.state.gateInput,\n      gateRefCb: this.gateRefCb,\n      onGateInput: (e) => this.setState({ gateInput: e.target.value }),\n      onGateKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.submitGate(); } },\n      submitGate: this.submitGate,\n      justBrowsing: this.justBrowsing,\n\n      plain: this.state.plain,\n      openPlain: () => this.setState({ plain: true, menuOpen: false }),\n      closePlain: () => this.setState({ plain: false }),\n      isBefore: this.state.ba === 'before',\n      isAfter: this.state.ba === 'after',\n      showBefore: () => this.setState({ ba: 'before' }),\n      showAfter: () => this.setState({ ba: 'after' }),\n      beforeBtn: pill(this.state.ba === 'before'),\n      afterBtn: pill(this.state.ba === 'after')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
