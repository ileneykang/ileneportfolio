  <!-- ── TEMPORARY ACCESS GATE ─────────────────────────────────────────────
       Soft lock only. The page bundle still loads underneath and the source is
       in the public repo — this stops casual visitors, it is NOT real security.
       The gate re-asserts itself because the page bundler replaces <html> on
       load. To remove the lock: delete this whole block (through the matching
       end comment) and redeploy. -->
  <script>
  (function () {
    var HASH = '2743e2174049225f5d65bda2faee0273f538f7f52e84be3b318ae1aa2bb08e02';
    var KEY = '__portfolio_unlocked';
    try { if (sessionStorage.getItem(KEY) === HASH) { window.__gateUnlocked = true; } } catch (e) {}
    if (window.__gateUnlocked) return;

    function sha256(str) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) {
          return ('0' + b.toString(16)).slice(-2);
        }).join('');
      });
    }

    function build() {
      var wrap = document.createElement('div');
      wrap.id = '__gate';
      wrap.setAttribute('style', [
        'position:fixed', 'inset:0', 'z-index:2147483647', 'background:#f4f1ea',
        'display:flex', 'align-items:center', 'justify-content:center', 'padding:24px',
        'font-family:Georgia,\'Times New Roman\',serif', 'color:#252a34'
      ].join(';'));
      wrap.innerHTML =
        '<div style="width:100%;max-width:360px;text-align:center">' +
          '<div style="font-size:22px;font-weight:600;margin-bottom:8px;letter-spacing:-0.01em">This portfolio is being finished</div>' +
          '<div style="font-size:14px;line-height:1.5;color:#6b675e;font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin-bottom:20px">Not quite ready for visitors yet. If you have the access phrase, enter it below.</div>' +
          '<form id="__gateForm" style="display:flex;gap:8px">' +
            '<input id="__gatePw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Access phrase" aria-label="Access phrase" style="flex:1;padding:10px 12px;font-size:15px;border:1px solid #d8d2c4;border-radius:8px;background:#fdfcf8;font-family:-apple-system,sans-serif">' +
            '<button type="submit" style="padding:10px 16px;font-size:14px;border:0;border-radius:8px;background:#252a34;color:#fff;cursor:pointer;font-family:-apple-system,sans-serif">Enter</button>' +
          '</form>' +
          '<div id="__gateErr" aria-live="polite" style="color:#b3261e;font-size:13px;margin-top:12px;min-height:16px;font-family:-apple-system,sans-serif"></div>' +
        '</div>';
      var err = wrap.querySelector('#__gateErr');
      wrap.querySelector('#__gateForm').addEventListener('submit', function (e) {
        e.preventDefault();
        err.textContent = '';
        var val = wrap.querySelector('#__gatePw').value;
        sha256(val).then(function (h) {
          if (h === HASH) {
            window.__gateUnlocked = true;
            try { sessionStorage.setItem(KEY, HASH); } catch (x) {}
            var g = document.getElementById('__gate');
            if (g) g.remove();
            var r = document.documentElement.style; r.overflow = ''; r.height = '';
          } else {
            err.textContent = 'That phrase is not right.';
            wrap.querySelector('#__gatePw').value = '';
            wrap.querySelector('#__gatePw').focus();
          }
        }).catch(function () { err.textContent = 'This browser blocked the check.'; });
      });
      return wrap;
    }

    var focused = false;
    function assert() {
      if (window.__gateUnlocked) return;
      var root = document.body || document.documentElement;
      if (root && !document.getElementById('__gate')) {
        root.appendChild(build());
        if (!focused) { var i = document.getElementById('__gatePw'); if (i) { i.focus(); focused = true; } }
      }
      var s = document.documentElement.style;
      s.overflow = 'hidden'; s.height = '100%';
      requestAnimationFrame(assert);
    }
    requestAnimationFrame(assert);
  })();
  </script>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

3, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; background: oklch(0.955 0.008 85); }\n  body { font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, sans-serif; -webkit-font-smoothing: antialiased; color: oklch(0.24 0.012 70); }\n  * { box-sizing: border-box; }\n  a { color: oklch(0.5 0.13 255); text-decoration: none; border-bottom: 1px solid color-mix(in oklab, oklch(0.5 0.13 255) 35%, transparent); }\n  a:hover { color: oklch(0.42 0.14 255); border-bottom-color: oklch(0.42 0.14 255); }\n  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }\n  ::selection { background: oklch(0.86 0.06 90); }\n  ::-webkit-scrollbar { width: 9px; height: 9px; }\n  ::-webkit-scrollbar-thumb { background: color-mix(in oklab, currentColor 20%, transparent); border-radius: 9px; }\n  ::-webkit-scrollbar-track { background: transparent; }\n  @keyframes ik-breathe { 0%,100% { opacity: .35 } 50% { opacity: 1 } }\n  input { font: inherit; color: inherit; }\n  input::placeholder { color: color-mix(in oklab, currentColor 42%, transparent); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"{{ shellStyle }}\">\n  <div style=\"flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; max-width: 1620px; margin: 0 auto; width: 100%; border: 1px solid oklch(0.885 0.008 80); border-radius: 16px; box-shadow: 0 1px 2px rgba(40,30,20,.04), 0 18px 50px -24px rgba(40,30,20,.22); overflow: hidden; background-color: #1F232B\">\n\n    \n\n    <div style=\"{{ colsStyle }}\">\n\n      <nav style=\"{{ navStyle }}\">\n        <div>\n          <div style=\"display: flex; align-items: center; gap: 8px; padding: 4px 0 10px;\">\n            <sc-if value=\"{{ navOpen }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"flex: 1 1 auto; font: 500 10px/1 'IBM Plex Mono', monospace; letter-spacing: .18em; text-transform: uppercase; color: oklch(0.68 0.015 265); white-space: nowrap; overflow: hidden;\">Selected work<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ wide }}\" hint-placeholder-val=\"{{ true }}\">\n              <button sc-camel-on-click=\"{{ toggleNav }}\" title=\"{{ navToggleTitle }}\" style=\"flex: 0 0 auto; width: 24px; height: 24px; border-radius: 7px; border: 1px solid oklch(0.42 0.02 265); color: oklch(0.82 0.01 265); display: flex; align-items: center; justify-content: center; font: 400 10px/1 'IBM Plex Mono', monospace;\" style-hover=\"background: oklch(0.34 0.02 265); color: oklch(0.97 0.005 265);\">{{ navIcon }}<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ navOpen }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"{{ worksListStyle }}\">\n              <sc-for list=\"{{ works }}\" as=\"w\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ w.go }}\" style=\"{{ w.rowStyle }}\">\n                  <span style=\"font: 500 10px/1 'IBM Plex Mono', monospace; letter-spacing: .1em; opacity: .55;\">{{ w.num }}<\u002Fspan>\n                  <span style=\"font-family: Fraunces, Georgia, serif; font-size: 14.5px; line-height: 1.25; letter-spacing: -0.01em; display: block; margin-top: 5px; text-wrap: pretty;\">{{ w.title }}<\u002Fspan>\n                  <span style=\"font: 400 10px/1 'IBM Plex Mono', monospace; letter-spacing: .06em; opacity: .6; display: block; margin-top: 7px;\">{{ w.meta }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ navRail }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n              <sc-for list=\"{{ works }}\" as=\"w\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ w.go }}\" title=\"{{ w.title }}\" style=\"{{ w.railStyle }}\">{{ w.num }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showDots }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 18px; flex: 1 1 auto;\">\n            <div style=\"border-top: 1px solid oklch(0.38 0.02 265); padding-top: 14px;\">\n              <div style=\"font: 500 10px/1 'IBM Plex Mono', monospace; letter-spacing: .18em; text-transform: uppercase; color: oklch(0.68 0.015 265); padding-bottom: 10px;\">In this case<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column;\">\n                <sc-for list=\"{{ dots }}\" as=\"d\" hint-placeholder-count=\"7\">\n                  <button sc-camel-on-click=\"{{ d.go }}\" style=\"display: flex; align-items: center; gap: 9px; padding: 5px 0; text-align: left;\">\n                    <span style=\"{{ d.dotStyle }}\"><\u002Fspan>\n                    <span style=\"{{ d.labelStyle }}\">{{ d.label }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top: auto; padding-top: 14px; font: 400 10px/1.7 'IBM Plex Mono', monospace; color: oklch(0.58 0.015 265);\">← → to move<br>Swipe on touch<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fnav>\n\n      <main style=\"{{ mainStyle }}\">\n        \n\n        <div style=\"flex: 0 0 auto; display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 16px; border-bottom: 1px solid oklch(0.925 0.008 80);\">\n          <div style=\"display: flex; gap: 8px; flex: 0 0 auto;\">\n            <span style=\"width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 1px rgba(0,0,0,.09);\"><\u002Fspan>\n            <span style=\"width: 11px; height: 11px; border-radius: 50%; background: #febc2e; box-shadow: inset 0 0 0 1px rgba(0,0,0,.09);\"><\u002Fspan>\n            <span style=\"width: 11px; height: 11px; border-radius: 50%; background: #28c840; box-shadow: inset 0 0 0 1px rgba(0,0,0,.09);\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; justify-content: center; gap: 10px; flex-wrap: wrap;\">\n            \n            <span style=\"font: 500 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: oklch(0.56 0.015 70); white-space: nowrap; font-weight: 700\"><span style=\"color: rgb(110, 106, 97); font-family: &quot;JetBrains Mono&quot;, monospace; font-size: 11.5px; font-weight: 400; letter-spacing: 0.46px; text-align: center; text-transform: none; background-color: rgb(242, 238, 231);\"><\u002Fspan><\u002Fspan><span style=\"font: 500 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: oklch(0.56 0.015 70); white-space: nowrap;\">Ilene Kang — Sr. UX Designer ·<\u002Fspan><span style=\"font: 500 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: oklch(0.56 0.015 70); white-space: nowrap;\">MERCHANT FRAUD PLATFORM<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex: 0 0 auto; margin-left: auto; position: relative;\">\n            <button sc-camel-on-click=\"{{ toggleMenu }}\" title=\"Options\" style=\"width: 30px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; gap: 3px; color: oklch(0.45 0.012 70);\" style-hover=\"background: oklch(0.915 0.008 80);\">\n              <span style=\"width: 3px; height: 3px; border-radius: 50%; background: currentColor;\"><\u002Fspan>\n              <span style=\"width: 3px; height: 3px; border-radius: 50%; background: currentColor;\"><\u002Fspan>\n              <span style=\"width: 3px; height: 3px; border-radius: 50%; background: currentColor;\"><\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <div sc-camel-on-click=\"{{ closeMenu }}\" style=\"position: fixed; inset: 0; z-index: 39;\"><\u002Fdiv>\n                <div style=\"position: absolute; top: 32px; right: 0; z-index: 40; width: 246px; padding: 6px; background: oklch(0.995 0.003 85); border: 1px solid oklch(0.87 0.008 80); border-radius: 12px; box-shadow: 0 14px 34px -12px rgba(40,30,20,.28);\">\n                  <button sc-camel-on-click=\"{{ openPlain }}\" style=\"display: block; width: 100%; text-align: left; padding: 9px 10px; border-radius: 8px; font-size: 13.5px; color: oklch(0.26 0.012 70);\" style-hover=\"background: oklch(0.955 0.008 85);\">Read plain text version<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ replayGate }}\" style=\"display: block; width: 100%; text-align: left; padding: 9px 10px; border-radius: 8px; font-size: 13.5px; color: oklch(0.26 0.012 70);\" style-hover=\"background: oklch(0.955 0.008 85);\">Show entry gate again<\u002Fbutton>\n                  <div style=\"padding: 7px 10px 4px; font: 400 10px/1.5 'IBM Plex Mono', monospace; color: oklch(0.62 0.015 70);\">Text-only, no motion. Esc returns.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv><div sc-camel-on-touch-start=\"{{ onTouchStart }}\" sc-camel-on-touch-end=\"{{ onTouchEnd }}\" style=\"{{ viewportStyle }}\">\n          <div style=\"{{ trackStyle }}\">\n\n            <section data-screen-label=\"01 · Overview\" style=\"flex: 0 0 100%; width: 100%; height: 100%; overflow-y: auto; padding: clamp(26px, 3.4vw, 54px);\">\n              <div style=\"max-width: 900px;\">\n                <div style=\"font: 500 11px/1 'IBM Plex Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: oklch(0.5 0.12 255);\">Case 01 · Payments risk<\u002Fdiv>\n                <h1 style=\"font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(34px, 4.2vw, 62px); line-height: 1.0; letter-spacing: -0.025em; color: oklch(0.2 0.012 70); margin: 18px 0 0; text-wrap: balance;\">Fraud Agents need to make a decision on a transaction in 20 seconds<\u002Fh1>\n                <p style=\"font-size: clamp(16px, 1.2vw, 19px); line-height: 1.5; color: oklch(0.42 0.012 70); max-width: 58ch; margin: 20px 0 0; text-wrap: pretty;\">Rebuilt merchant fraud review around the decision, then used a design partner program to pressure-test it with the teams who live in the queue.<\u002Fp>\n                <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 34px;\">\n                  <div style=\"background: oklch(0.995 0.003 85); border: 1px solid oklch(0.9 0.008 80); border-radius: 10px; padding: 15px 16px;\">\n                    <div style=\"font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: oklch(0.6 0.015 70);\">Role<\u002Fdiv>\n                    <div style=\"font-size: 13.5px; color: oklch(0.28 0.012 70); margin-top: 7px;\">UX Lead<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"background: oklch(0.995 0.003 85); border: 1px solid oklch(0.9 0.008 80); border-radius: 10px; padding: 15px 16px;\">\n                    <div style=\"font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: oklch(0.6 0.015 70);\">Team<\u002Fdiv>\n                    <div style=\"font-size: 13.5px; color: oklch(0.28 0.012 70); margin-top: 7px;\">2 design · 6 eng · risk ops<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"background: oklch(0.995 0.003 85); border: 1px solid oklch(0.9 0.008 80); border-radius: 10px; padding: 15px 16px;\">\n                    <div style=\"font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: oklch(0.6 0.015 70);\">Year<\u002Fdiv>\n                    <div style=\"font-size: 13.5px; color: oklch(0.28 0.012 70); margin-top: 7px;\">2025<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"background: oklch(0.995 0.003 85); border: 1px solid oklch(0.9 0.008 80); border-radius: 10px; padding: 15px 16px;\">\n                    <div style=\"font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: oklch(0.6 0.015 70);\">Surface<\u002Fdiv>\n                    <div style=\"font-size: 13.5px; color: oklch(0.28 0.012 70); margin-top: 7px;\">Review console + partner program<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display: flex; align-items: center; gap: 10px; margin-top: 26px; font: 400 10.5px/1.6 'IBM Plex Mono', monospace; color: oklch(0.62 0.015 70);\">\n                  <span style=\"display: inline-block; width: 22px; height: 1px; background: oklch(0.82 0.01 80);\"><\u002Fspan>\n                  Placeholder framing — swap in your approved language.\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsection>\n\n            <section data-screen-label=\"02 · Problem\" style=\"flex: 0 0 100%; width: 100%; height: 100%; overflow-y: auto; padding: clamp(26px, 3.4vw, 54px);\">\n              <div style=\"max-width: 1020px;\">\n                <div style=\"font: 500 11px/1 'IBM Plex Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: oklch(0.5 0.12 255);\">Problem<\u002Fdiv>\n                <h2 style=\"font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(27px, 3vw, 44px); line-height: 1.05; letter-spacing: -0.022em; color: oklch(0.2 0.012 70); margin: 14px 0 0; text-wrap: balance;\">Reviewers were clearing a queue, not making a decision.<\u002Fh2>\n                <p style=\"font-size: clamp(15px, 1.1vw, 18px); line-height: 1.5; color: oklch(0.44 0.012 70); max-width: 62ch; margin: 16px 0 0; text-wrap: pretty;\">Every case arrived looking identical, so speed came from habit instead of signal — and the same merchants kept coming back.<\u002Fp>\n                <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 32px;\">\n                  <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n                    <div style=\"display: flex; gap: 12px;\"><span style=\"font: 500 10px/1.7 'IBM Plex Mono', monospace; color: oklch(0.62 0.015 70); flex: 0 0 auto;\">01<\u002Fspan><p style=\"margin: 0; font-size: 14.5px; line-height: 1.6; color: oklch(0.36 0.012 70); text-wrap: pretty;\">Risk signals lived in four tools. Reviewers rebuilt the story by hand on every case.<\u002Fp><\u002Fdiv>\n                    <div style=\"display: flex; gap: 12px;\"><span style=\"font: 500 10px/1.7 'IBM Plex Mono', monospace; color: oklch(0.62 0.015 70); flex: 0 0 auto;\">02<\u002Fspan><p style=\"margin: 0; font-size: 14.5px; line-height: 1.6; color: oklch(0.36 0.012 70); text-wrap: pretty;\">Decisions were final. With no reversible path, reviewers escalated instead of deciding.<\u002Fp><\u002Fdiv>\n                    <div style=\"display: flex; gap: 12px;\"><span style=\"font: 500 10px/1.7 'IBM Plex Mono', monospace; color: oklch(0.62 0.015 70); flex: 0 0 auto;\">03<\u002Fspan><p style=\"margin: 0; font-size: 14.5px; line-height: 1.6; color: oklch(0.36 0.012 70); text-wrap: pretty;\">Ops and product read the same numbers differently, so nobody agreed on what \"good\" looked like.<\u002Fp><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"background: oklch(0.968 0.007 85); border: 1px solid oklch(0.905 0.008 80); border-radius: 12px; padding: 20px;\">\n                    <div style=\"font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: oklch(0.6 0.015 70);\">What we heard<\u002Fdiv>\n                    <p style=\"font-family: Fraunces, Georgia, serif; font-size: 19px; line-height: 1.35; color: oklch(0.26 0.012 70); margin: 14px 0 0; text-wrap: pretty;\">“I know the answer in ten seconds. The other four minutes are proving it.”<\u002Fp>\n                    <div style=\"font: 400 10.5px/1.6 'IBM Plex Mono', monospace; color: oklch(0.62 0.015 70); margin-top: 14px;\">[quote placeholder · senior reviewer]<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 24px;\">\n                  <div style=\"border: 1px dashed oklch(0.86 0.01 80); border-radius: 10px; padding: 14px 16px;\"><div style=\"font: 500 20px/1 'IBM Plex Mono', monospace; color: oklch(0.34 0.012 70);\">00:00<\u002Fdiv><div style=\"font: 400 10px/1.5 'IBM Plex Mono', monospace; color: oklch(0.6 0.015 70); margin-top: 8px;\">median review time [TBD]<\u002Fdiv><\u002Fdiv>\n                  <div style=\"border: 1px dashed oklch(0.86 0.01 80); border-radius: 10px; padding: 14px 16px;\"><div style=\"font: 500 20px/1 'IBM Plex Mono', monospace; color: oklch(0.34 0.012 70);\">00%<\u002Fdiv><div style=\"font: 400 10px/1.5 'IBM Plex Mono', monospace; color: oklch(0.6 0.015 70); margin-top: 8px;\">escalation rate [TBD]<\u002Fdiv><\u002Fdiv>\n                  <div style=\"border: 1px dashed oklch(0.86 0.01 80); border-radius: 10px; padding: 14px 16px;\"><div style=\"font: 500 20px/1 'IBM Plex Mono', monospace; color: oklch(0.34 0.012 70);\">00%<\u002Fdiv><div style=\"font: 400 10px/1.5 'IBM Plex Mono', monospace; color: oklch(0.6 0.015 70); margin-top: 8px;\">repeat cases [TBD]<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsection>\n\n            <section data-screen-label=\"03 · Research\" style=\"flex: 0 0 100%; width: 100%; height: 100%; overflow-y: auto; padding: clamp(26px, 3.4vw, 54px);\">\n              <div style=\"max-width: 1020px;\">\n                <div style=\"font: 500 11px/1 'IBM Plex Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: oklch(0.5 0.12 255);\">Research<\u002Fdiv>\n                <h2 style=\"font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(27px, 3vw, 44px); line-height: 1.05; letter-spacing: -0.022em; color: oklch(0.2 0.012 70); margin: 14px 0 0; text-wrap: balance;\">We watched twelve reviews before we drew anything.<\u002Fh2>\n                <p style=\"font-size: clamp(15px, 1.1vw, 18px); line-height: 1.5; color: oklch(0.44 0.012 70); max-width: 62ch; margin: 16px 0 0; text-wrap: pretty;\">Contextual sessions, queue telemetry, and a two-week analyst diary set the frame — and killed two of our three assumptions.<\u002Fp>\n                <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 14px; margin-top: 30px;\">\n                  <div style=\"border: 1px solid oklch(0.9 0.008 80); border-radius: 12px; overflow: hidden;\">\n                    <div style=\"aspect-ratio: 4 / 3; background: repeating-linear-gradient(135deg, oklch(0.93 0.008 80) 0 1px, oklch(0.978 0.005 85) 1px 8px); display: flex; align-items: center; justify-content: center;\"><span style=\"font: 400 10px/1 'IBM Plex Mono', monospace; color: oklch(0.58 0.015 70); background: oklch(0.995 0.003 85); padding: 5px 9px; border-radius: 20px;\">session clip<\u002Fspan><\u002Fdiv>\n                    <div style=\"padding: 14px 16px;\"><div style=\"font-family: Fraunces, Georgia, serif; font-size: 16px; color: oklch(0.24 0.012 70);\">12 contextual sessions<\u002Fdiv><p style=\"margin: 7px 0 0; font-size: 13px; line-height: 1.55; color: oklch(0.46 0.012 70);\">Recorded over the shoulder, three shifts, two regions.<\u002Fp><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid oklch(0.9 0.008 80); border-radius: 12px; overflow: hidden;\">\n                    <div style=\"aspect-ratio: 4 / 3; background: repeating-linear-gradient(135deg, oklch(0.93 0.008 80) 0 1px, oklch(0.978 0.005 85) 1px 8px); display: flex; align-items: center; justify-content: center;\"><span style=\"font: 400 10px/1 'IBM Plex Mono', monospace; color: oklch(0.58 0.015 70); background: oklch(0.995 0.003 85); padding: 5px 9px; border-radius: 20px;\">telemetry chart<\u002Fspan><\u002Fdiv>\n                    <div style=\"padding: 14px 16px;\"><div style=\"font-family: Fraunces, Georgia, serif; font-size: 16px; color: oklch(0.24 0.012 70);\">Queue telemetry<\u002Fdiv><p style=\"margin: 7px 0 0; font-size: 13px; line-height: 1.55; color: oklch(0.46 0.012 70);\">Where time actually went, per case type.<\u002Fp><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid oklch(0.9 0.008 80); border-radius: 12px; overflow: hidden;\">\n                    <div style=\"aspect-ratio: 4 / 3; background: repeating-linear-gradient(135deg, oklch(0.93 0.008 80) 0 1px, oklch(0.978 0.005 85) 1px 8px); display: flex; align-items: center; justify-content: center;\"><span style=\"font: 400 10px/1 'IBM Plex Mono', monospace; color: oklch(0.58 0.015 70); background: oklch(0.995 0.003 85); padding: 5px 9px; border-radius: 20px;\">diary artifact<\u002Fspan><\u002Fdiv>\n                    <div style=\"padding: 14px 16px;\"><div style=\"font-family: Fraunces, Georgia, serif; font-size: 16px; color: oklch(0.24 0.012 70);\">Analyst diary<\u002Fdiv><p style=\"margin: 7px 0 0; font-size: 13px; line-height: 1.55; color: oklch(0.46 0.012 70);\">Two weeks of self-reported dead ends.<\u002Fp><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"margin-top: 26px; padding: 18px 20px; background: oklch(0.968 0.007 85); border-radius: 12px;\">\n                  <div style=\"font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: oklch(0.6 0.015 70);\">The finding that changed the design<\u002Fdiv>\n                  <p style=\"margin: 12px 0 0; font-size: 15px; line-height: 1.55; color: oklch(0.32 0.012 70); max-width: 70ch; text-wrap: pretty;\">Reviewers did not need more data. They needed the case to tell them which signal to disbelieve first.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsection>\n\n            <section data-screen-label=\"04 · Interaction model\" style=\"flex: 0 0 100%; width: 100%; height: 100%; overflow-y: auto; padding: clamp(26px, 3.4vw, 54px);\">\n              <div style=\"max-width: 1020px;\">\n                <div style=\"font: 500 11px/1 'IBM Plex Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: oklch(0.5 0.12 255);\">Interaction model<\u002Fdiv>\n                <h2 style=\"font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(27px, 3vw, 44px); line-height: 1.05; letter-spacing: -0.022em; color: oklch(0.2 0.012 70); margin: 14px 0 0; text-wrap: balance;\">One case, three passes: triage, evidence, decision.<\u002Fh2>\n                <p style=\"font-size: clamp(15px, 1.1vw, 18px); line-height: 1.5; color: oklch(0.44 0.012 70); max-width: 62ch; margin: 16px 0 0; text-wrap: pretty;\">The riskiest signal leads, evidence expands in place, and the decision stays reversible for 24 hours.<\u002Fp>\n                <div style=\"display: flex; align-items: center; gap: 10px; margin-top: 26px;\">\n                  <button sc-camel-on-click=\"{{ showBefore }}\" style=\"{{ beforeBtn }}\">Before<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ showAfter }}\" style=\"{{ afterBtn }}\">After<\u002Fbutton>\n                  <span style=\"font: 400 10px/1 'IBM Plex Mono', monospace; color: oklch(0.62 0.015 70); margin-left: 4px;\">toggle the model<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"margin-top: 16px; border: 1px solid oklch(0.9 0.008 80); border-radius: 14px; background: oklch(0.968 0.007 85); padding: clamp(14px, 1.6vw, 22px);\">\n                  <sc-if value=\"{{ isBefore }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div>\n                      <div style=\"font: 400 10px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: oklch(0.6 0.015 70); margin-bottom: 14px;\">Before · undifferentiated queue<\u002Fdiv>\n                      <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n                        <div style=\"display: flex; align-items: center; gap: 12px; background: oklch(0.995 0.003 85); border: 1px solid oklch(0.92 0.008 80); border-radius: 8px; padding: 13px 14px;\"><span style=\"width: 8px; height: 8px; border-radius: 2px; background: oklch(0.86 0.01 80);\"><\u002Fspan><span style=\"height: 8px; border-radius: 4px; background: oklch(0.9 0.008 80); flex: 1 1 auto;\"><\u002Fspan><span style=\"height: 8px; width: 54px; border-radius: 4px; background: oklch(0.9 0.008 80);\"><\u002Fspan><\u002Fdiv>\n                        <div style=\"display: flex; align-items: center; gap: 12px; background: oklch(0.995 0.003 85); border: 1px solid oklch(0.92 0.008 80); border-radius: 8px; padding: 13px 14px;\"><span style=\"width: 8px; height: 8px; border-radius: 2px; background: oklch(0.86 0.01 80);\"><\u002Fspan><span style=\"height: 8px; border-radius: 4px; background: oklch(0.9 0.008 80); flex: 1 1 auto;\"><\u002Fspan><span style=\"height: 8px; width: 54px; border-radius: 4px; background: oklch(0.9 0.008 80);\"><\u002Fspan><\u002Fdiv>\n                        <div style=\"display: flex; align-items: center; gap: 12px; background: oklch(0.995 0.003 85); border: 1px solid oklch(0.92 0.008 80); border-radius: 8px; padding: 13px 14px;\"><span style=\"width: 8px; height: 8px; border-radius: 2px; background: oklch(0.86 0.01 80);\"><\u002Fspan><span style=\"height: 8px; border-radius: 4px; background: oklch(0.9 0.008 80); flex: 1 1 auto;\"><\u002Fspan><span style=\"height: 8px; width: 54px; border-radius: 4px; background: oklch(0.9 0.008 80);\"><\u002Fspan><\u002Fdiv>\n                        <div style=\"display: flex; align-items: center; gap: 12px; background: oklch(0.995 0.003 85); border: 1px solid oklch(0.92 0.008 80); border-radius: 8px; padding: 13px 14px;\"><span style=\"width: 8px; height: 8px; border-radius: 2px; background: oklch(0.86 0.01 80);\"><\u002Fspan><span style=\"height: 8px; border-radius: 4px; background: oklch(0.9 0.008 80); flex: 1 1 auto;\"><\u002Fspan><span style=\"height: 8px; width: 54px; border-radius: 4px; background: oklch(0.9 0.008 80);\"><\u002Fspan><\u002Fdiv>\n                        <div style=\"display: flex; align-items: center; gap: 12px; background: oklch(0.995 0.003 85); border: 1px solid oklch(0.92 0.008 80); border-radius: 8px; padding: 13px 14px;\"><span style=\"width: 8px; height: 8px; border-radius: 2px; background: oklch(0.86 0.01 80);\"><\u002Fspan><span style=\"height: 8px; border-radius: 4px; background: oklch(0.9 0.008 80); flex: 1 1 auto;\"><\u002Fspan><span style=\"height: 8px; width: 54px; border-radius: 4px; background: oklch(0.9 0.008 80);\"><\u002Fspan><\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"font: 400 11px/1.6 'IBM Plex Mono', monospace; color: oklch(0.55 0.015 70); margin-top: 14px;\">Same weight, same order, no first move.<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ isAfter }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div>\n                      <div style=\"font: 400 10px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: oklch(0.5 0.12 255); margin-bottom: 14px;\">After · signal-first case<\u002Fdiv>\n                      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px;\">\n                        <div style=\"background: oklch(0.995 0.003 85); border: 1px solid oklch(0.9 0.008 80); border-radius: 10px; padding: 16px; border-left: 3px solid oklch(0.55 0.14 255);\">\n                          <div style=\"font: 500 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: oklch(0.5 0.12 255);\">Pass 1 · Triage<\u002Fdiv>\n                          <div style=\"font-family: Fraunces, Georgia, serif; font-size: 17px; color: oklch(0.24 0.012 70); margin-top: 10px;\">Lead signal, stated as a claim<\u002Fdiv>\n                          <div style=\"display: flex; flex-direction: column; gap: 7px; margin-top: 14px;\"><span style=\"height: 10px; border-radius: 4px; background: oklch(0.88 0.03 255); width: 82%;\"><\u002Fspan><span style=\"height: 8px; border-radius: 4px; background: oklch(0.92 0.008 80); width: 60%;\"><\u002Fspan><\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"background: oklch(0.995 0.003 85); border: 1px solid oklch(0.9 0.008 80); border-radius: 10px; padding: 16px;\">\n                          <div style=\"font: 500 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: oklch(0.6 0.015 70);\">Pass 2 · Evidence<\u002Fdiv>\n                          <div style=\"font-family: Fraunces, Georgia, serif; font-size: 17px; color: oklch(0.24 0.012 70); margin-top: 10px;\">Expands in place<\u002Fdiv>\n                          <div style=\"display: flex; flex-direction: column; gap: 7px; margin-top: 14px;\"><span style=\"height: 8px; border-radius: 4px; background: oklch(0.9 0.008 80); width: 100%;\"><\u002Fspan><span style=\"height: 8px; border-radius: 4px; background: oklch(0.9 0.008 80); width: 88%;\"><\u002Fspan><span style=\"height: 8px; border-radius: 4px; background: oklch(0.9 0.008 80); width: 47%;\"><\u002Fspan><\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: oklch(0.995 0.003 85); border: 1px solid oklch(0.9 0.008 80); border-radius: 10px; padding: 14px 16px; margin-top: 12px;\">\n                        <span style=\"font: 500 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: oklch(0.6 0.015 70);\">Pass 3 · Decision<\u002Fspan>\n                        <span style=\"flex: 1 1 60px;\"><\u002Fspan>\n                        <span style=\"font-size: 12.5px; padding: 7px 13px; border-radius: 20px; background: oklch(0.55 0.14 255); color: oklch(0.99 0.005 255);\">Approve<\u002Fspan>\n                        <span style=\"font-size: 12.5px; padding: 7px 13px; border-radius: 20px; border: 1px solid oklch(0.88 0.01 80); color: oklch(0.36 0.012 70);\">Hold<\u002Fspan>\n                        <span style=\"font: 400 10px/1 'IBM Plex Mono', monospace; color: oklch(0.62 0.015 70);\">reversible 24h<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font: 400 11px/1.6 'IBM Plex Mono', monospace; color: oklch(0.55 0.015 70); margin-top: 14px;\">Anchored decision bar, never a new screen.<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsection>\n\n            <section data-screen-label=\"05 · Demo\" style=\"flex: 0 0 100%; width: 100%; height: 100%; overflow-y: auto; padding: clamp(26px, 3.4vw, 54px);\">\n              <div style=\"max-width: 1020px;\">\n                <div style=\"font: 500 11px/1 'IBM Plex Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: oklch(0.5 0.12 255);\">Demo<\u002Fdiv>\n                <h2 style=\"font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(27px, 3vw, 44px); line-height: 1.05; letter-spacing: -0.022em; color: oklch(0.2 0.012 70); margin: 14px 0 0; text-wrap: balance;\">The reviewer never leaves the case.<\u002Fh2>\n                <p style=\"font-size: clamp(15px, 1.1vw, 18px); line-height: 1.5; color: oklch(0.44 0.012 70); max-width: 62ch; margin: 16px 0 0; text-wrap: pretty;\">Thirty-four seconds, sound off: open case, disbelieve the lead signal, decide, undo.<\u002Fp>\n                <div style=\"margin-top: 26px; aspect-ratio: 16 / 9; border-radius: 14px; border: 1px dashed oklch(0.86 0.01 80); background: repeating-linear-gradient(135deg, oklch(0.93 0.008 80) 0 1px, oklch(0.978 0.005 85) 1px 9px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;\">\n                  <span style=\"width: 52px; height: 52px; border-radius: 50%; background: oklch(0.995 0.003 85); border: 1px solid oklch(0.88 0.01 80); display: flex; align-items: center; justify-content: center; font-size: 15px; color: oklch(0.3 0.012 70); padding-left: 3px;\">▶<\u002Fspan>\n                  <span style=\"font: 400 11px/1.6 'IBM Plex Mono', monospace; color: oklch(0.5 0.015 70); text-align: center; padding: 0 20px;\">[ video · 0:34 · interaction walkthrough ]<br>drop MP4 / WebM here<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-top: 20px;\">\n                  <div><div style=\"font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: oklch(0.6 0.015 70);\">0:00 — 0:09<\u002Fdiv><p style=\"margin: 8px 0 0; font-size: 13.5px; line-height: 1.55; color: oklch(0.4 0.012 70);\">Case opens with the lead claim already stated.<\u002Fp><\u002Fdiv>\n                  <div><div style=\"font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: oklch(0.6 0.015 70);\">0:09 — 0:24<\u002Fdiv><p style=\"margin: 8px 0 0; font-size: 13.5px; line-height: 1.55; color: oklch(0.4 0.012 70);\">Evidence expands inline; nothing navigates away.<\u002Fp><\u002Fdiv>\n                  <div><div style=\"font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: oklch(0.6 0.015 70);\">0:24 — 0:34<\u002Fdiv><p style=\"margin: 8px 0 0; font-size: 13.5px; line-height: 1.55; color: oklch(0.4 0.012 70);\">Decision, then undo — the reversible path in practice.<\u002Fp><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsection>\n\n            <section data-screen-label=\"06 · Design Partner Program\" style=\"flex: 0 0 100%; width: 100%; height: 100%; overflow-y: auto; padding: clamp(26px, 3.4vw, 54px);\">\n              <div style=\"max-width: 1020px;\">\n                <div style=\"font: 500 11px/1 'IBM Plex Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: oklch(0.5 0.12 255);\">Design Partner Program<\u002Fdiv>\n                <h2 style=\"font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(27px, 3vw, 44px); line-height: 1.05; letter-spacing: -0.022em; color: oklch(0.2 0.012 70); margin: 14px 0 0; text-wrap: balance;\">The rollout was the research.<\u002Fh2>\n                <p style=\"font-size: clamp(15px, 1.1vw, 18px); line-height: 1.5; color: oklch(0.44 0.012 70); max-width: 62ch; margin: 16px 0 0; text-wrap: pretty;\">Four partner teams, two-week cycles, one shared changelog. Shipping to them replaced the usability lab.<\u002Fp>\n                <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-top: 30px;\">\n                  <div style=\"background: oklch(0.995 0.003 85); border: 1px solid oklch(0.9 0.008 80); border-radius: 10px; padding: 20px 18px;\"><div style=\"font-family: Fraunces, Georgia, serif; font-size: 26px; color: oklch(0.78 0.03 255);\">01<\u002Fdiv><div style=\"font-size: 14.5px; color: oklch(0.24 0.012 70); margin-top: 10px;\">Recruit by pain<\u002Fdiv><p style=\"margin: 8px 0 0; font-size: 13px; line-height: 1.55; color: oklch(0.47 0.012 70);\">Teams with the worst queue, not the friendliest.<\u002Fp><\u002Fdiv>\n                  <div style=\"background: oklch(0.995 0.003 85); border: 1px solid oklch(0.9 0.008 80); border-radius: 10px; padding: 20px 18px;\"><div style=\"font-family: Fraunces, Georgia, serif; font-size: 26px; color: oklch(0.78 0.03 255);\">02<\u002Fdiv><div style=\"font-size: 14.5px; color: oklch(0.24 0.012 70); margin-top: 10px;\">Two-week cycles<\u002Fdiv><p style=\"margin: 8px 0 0; font-size: 13px; line-height: 1.55; color: oklch(0.47 0.012 70);\">Build, ship to partners, watch, cut.<\u002Fp><\u002Fdiv>\n                  <div style=\"background: oklch(0.995 0.003 85); border: 1px solid oklch(0.9 0.008 80); border-radius: 10px; padding: 20px 18px;\"><div style=\"font-family: Fraunces, Georgia, serif; font-size: 26px; color: oklch(0.78 0.03 255);\">03<\u002Fdiv><div style=\"font-size: 14.5px; color: oklch(0.24 0.012 70); margin-top: 10px;\">One changelog<\u002Fdiv><p style=\"margin: 8px 0 0; font-size: 13px; line-height: 1.55; color: oklch(0.47 0.012 70);\">Every change traceable to a partner observation.<\u002Fp><\u002Fdiv>\n                  <div style=\"background: oklch(0.995 0.003 85); border: 1px solid oklch(0.9 0.008 80); border-radius: 10px; padding: 20px 18px;\"><div style=\"font-family: Fraunces, Georgia, serif; font-size: 26px; color: oklch(0.78 0.03 255);\">04<\u002Fdiv><div style=\"font-size: 14.5px; color: oklch(0.24 0.012 70); margin-top: 10px;\">Graduate<\u002Fdiv><p style=\"margin: 8px 0 0; font-size: 13px; line-height: 1.55; color: oklch(0.47 0.012 70);\">Partners became the internal case for GA.<\u002Fp><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"margin-top: 24px; padding: 18px 20px; border: 1px dashed oklch(0.86 0.01 80); border-radius: 12px; font: 400 11px/1.7 'IBM Plex Mono', monospace; color: oklch(0.55 0.015 70);\">[ artifact slot · partner changelog screenshot or cycle board ]<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsection>\n\n            <section data-screen-label=\"07 · Outcome\" style=\"flex: 0 0 100%; width: 100%; height: 100%; overflow-y: auto; padding: clamp(26px, 3.4vw, 54px);\">\n etter-spacing: .1em; text-transform: uppercase; opacity: .6; margin-top: 5px;\"><span style=\"width: 5px; height: 5px; border-radius: 50%; background: oklch(0.72 0.14 150);\"><\u002Fspan>Product Designer<\u002Fspan>\n          <\u002Fspan>\n          <sc-if value=\"{{ gated }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; font: 500 9px/1 'IBM Plex Mono', monospace; letter-spacing: .1em; text-transform: uppercase; padding: 6px 10px; border-radius: 20px; border: 1px solid color-mix(in oklab, currentColor 26%, transparent); opacity: .8;\">⌁ Quick check<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ gateAsk }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 18px;\">\n            <div style=\"max-width: 92%; align-self: flex-start; background: color-mix(in oklab, currentColor 10%, transparent); border: 1px solid color-mix(in oklab, currentColor 12%, transparent); border-radius: 14px 14px 14px 4px; padding: 15px 16px;\">\n              <div style=\"font-family: Fraunces, Georgia, serif; font-size: 19px; line-height: 1.25; letter-spacing: -0.015em; text-wrap: pretty;\">Quick human check — who's your employer?<\u002Fdiv>\n              <div style=\"font-size: 13px; line-height: 1.55; opacity: .72; margin-top: 10px;\">Just curious who's reading. Type your company name below.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; margin-top: 4px;\">\n              <input type=\"text\" placeholder=\"Type your company name…\" value=\"{{ gateInput }}\" sc-camel-on-change=\"{{ onGateInput }}\" sc-camel-on-key-down=\"{{ onGateKey }}\" data-gate-input=\"1\" ref=\"{{ gateRefCb }}\" style=\"flex: 1 1 auto; min-width: 0; padding: 12px 14px; border-radius: 22px; font-size: 13.5px; background: color-mix(in oklab, currentColor 9%, transparent); border: 1px solid color-mix(in oklab, currentColor 26%, transparent); outline: none;\">\n              <button sc-camel-on-click=\"{{ submitGate }}\" style=\"flex: 0 0 auto; padding: 0 18px; border-radius: 22px; background: oklch(0.55 0.14 255); color: oklch(0.99 0.004 255); font-size: 13.5px;\" style-hover=\"background: oklch(0.5 0.15 255);\">Check<\u002Fbutton>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ justBrowsing }}\" style=\"align-self: flex-start; font: 400 11px/1 'IBM Plex Mono', monospace; letter-spacing: .06em; opacity: .6; padding: 4px 0; border-bottom: 1px solid color-mix(in oklab, currentColor 35%, transparent);\" style-hover=\"opacity: 1;\">Just browsing?<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ gateReplied }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 18px;\">\n            <sc-if value=\"{{ gateEcho }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-width: 82%; align-self: flex-end; background: oklch(0.55 0.14 255); color: oklch(0.99 0.004 255); border-radius: 14px 14px 4px 14px; padding: 11px 15px; font-size: 13px;\">{{ gateEcho }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"max-width: 92%; align-self: flex-start; background: color-mix(in oklab, currentColor 10%, transparent); border: 1px solid color-mix(in oklab, currentColor 12%, transparent); border-radius: 14px 14px 14px 4px; padding: 14px 16px; font-size: 13.5px; line-height: 1.6; text-wrap: pretty;\">{{ gateMsg }}<\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 9px; font: 400 10px/1 'IBM Plex Mono', monospace; letter-spacing: .1em; text-transform: uppercase; opacity: .55; padding-top: 4px;\"><span style=\"width: 5px; height: 5px; border-radius: 50%; background: oklch(0.72 0.14 150); animation: ik-breathe 1.4s ease-in-out infinite;\"><\u002Fspan>Opening the portfolio<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isMenu }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 18px;\">\n            <div style=\"max-width: 88%; align-self: flex-start; background: color-mix(in oklab, currentColor 10%, transparent); border: 1px solid color-mix(in oklab, currentColor 12%, transparent); border-radius: 14px 14px 14px 4px; padding: 13px 15px; font-size: 13.5px; line-height: 1.55;\">You landed inside a case study, not a homepage. Read straight through, or jump anywhere from the left.<\u002Fdiv>\n            <div style=\"max-width: 88%; align-self: flex-start; background: color-mix(in oklab, currentColor 10%, transparent); border: 1px solid color-mix(in oklab, currentColor 12%, transparent); border-radius: 14px 14px 14px 4px; padding: 13px 15px; font-size: 13.5px; line-height: 1.55;\">Pick a reply — this panel is the map, not a chatbot.<\u002Fdiv>\n            <div style=\"font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; opacity: .5; padding: 10px 2px 2px;\">Quick replies<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ next }}\" style=\"display: flex; align-items: center; gap: 11px; text-align: left; padding: 13px 15px; border-radius: 22px; background: oklch(0.55 0.14 255); color: oklch(0.99 0.004 255); font-size: 13.5px;\" style-hover=\"background: oklch(0.5 0.15 255);\"><span style=\"width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid currentColor; flex: 0 0 auto;\"><\u002Fspan>Keep going →<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ showWorks }}\" style=\"display: flex; align-items: center; gap: 11px; text-align: left; padding: 13px 15px; border-radius: 22px; border: 1px solid color-mix(in oklab, currentColor 28%, transparent); font-size: 13.5px;\" style-hover=\"background: color-mix(in oklab, currentColor 10%, transparent);\"><span style=\"width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid color-mix(in oklab, currentColor 55%, transparent); flex: 0 0 auto;\"><\u002Fspan>See another project<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ showAbout }}\" style=\"display: flex; align-items: center; gap: 11px; text-align: left; padding: 13px 15px; border-radius: 22px; border: 1px solid color-mix(in oklab, currentColor 28%, transparent); font-size: 13.5px;\" style-hover=\"background: color-mix(in oklab, currentColor 10%, transparent);\"><span style=\"width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid color-mix(in oklab, currentColor 55%, transparent); flex: 0 0 auto;\"><\u002Fspan>Who made this?<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isWorks }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 18px;\">\n            <div style=\"max-width: 82%; align-self: flex-end; background: oklch(0.55 0.14 255); color: oklch(0.99 0.004 255); border-radius: 14px 14px 4px 14px; padding: 11px 15px; font-size: 13px;\">See another project<\u002Fdiv>\n            <div style=\"font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; opacity: .5; padding: 8px 2px 2px;\">All works<\u002Fdiv>\n            <sc-for list=\"{{ works }}\" as=\"w\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ w.go }}\" style=\"text-align: left; padding: 14px 15px; border-radius: 14px; border: 1px solid color-mix(in oklab, currentColor 18%, transparent); background: color-mix(in oklab, currentColor 7%, transparent);\" style-hover=\"background: color-mix(in oklab, currentColor 14%, transparent);\">\n                <span style=\"display: flex; align-items: baseline; gap: 9px; font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .1em; opacity: .55;\">{{ w.num }}<span style=\"letter-spacing: .06em;\">{{ w.meta }}<\u002Fspan><\u002Fspan>\n                <span style=\"display: block; font-family: Fraunces, Georgia, serif; font-size: 16px; line-height: 1.25; margin-top: 8px; text-wrap: pretty;\">{{ w.title }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n            <button sc-camel-on-click=\"{{ showMenu }}\" style=\"align-self: flex-start; margin-top: 6px; font: 400 11px/1 'IBM Plex Mono', monospace; letter-spacing: .06em; opacity: .65; padding: 8px 0;\" style-hover=\"opacity: 1;\">← back to replies<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 18px;\">\n            <div style=\"max-width: 82%; align-self: flex-end; background: oklch(0.55 0.14 255); color: oklch(0.99 0.004 255); border-radius: 14px 14px 4px 14px; padding: 11px 15px; font-size: 13px;\">Who made this?<\u002Fdiv>\n            <div style=\"background: color-mix(in oklab, currentColor 9%, transparent); border: 1px solid color-mix(in oklab, currentColor 14%, transparent); border-radius: 16px; padding: 18px;\">\n              <div style=\"font-family: Fraunces, Georgia, serif; font-size: 21px; line-height: 1.2; letter-spacing: -0.015em;\">Ilene (Ye Na) Kang<\u002Fdiv>\n              <div style=\"font: 400 9.5px/1.5 'IBM Plex Mono', monospace; letter-spacing: .1em; text-transform: uppercase; opacity: .6; margin-top: 8px;\">UX Lead · Technical Product Design<\u002Fdiv>\n              <p style=\"font-size: 13.5px; line-height: 1.65; margin: 16px 0 0; opacity: .92; text-wrap: pretty;\">I lead design on systems where the hard part is the decision, not the screen — risk, payments, and internal tools with real consequences.<\u002Fp>\n              <div style=\"height: 1px; background: color-mix(in oklab, currentColor 16%, transparent); margin: 18px 0;\"><\u002Fdiv>\n              <div style=\"font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; opacity: .55;\">How I think<\u002Fdiv>\n              <p style=\"font-size: 13.5px; line-height: 1.65; margin: 10px 0 0; opacity: .92; text-wrap: pretty;\">Start with the decision someone has to make, then remove everything that isn't evidence for it. Ship to a few real teams before polishing for everyone.<\u002Fp>\n              <div style=\"font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; opacity: .55; margin-top: 18px;\">Design meets code<\u002Fdiv>\n              <p style=\"font-size: 13.5px; line-height: 1.65; margin: 10px 0 0; opacity: .92; text-wrap: pretty;\">I prototype in the browser. It keeps the argument honest — if the interaction can't be built, it isn't a design decision yet.<\u002Fp>\n              <div style=\"font: 400 10.5px/1.6 'IBM Plex Mono', monospace; opacity: .5; margin-top: 16px;\">[ placeholder bio — swap in your words ]<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; opacity: .5; padding: 8px 2px 2px;\">Back to the work<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ goFraud }}\" style=\"display: flex; align-items: center; gap: 11px; text-align: left; padding: 12px 15px; border-radius: 22px; border: 1px solid color-mix(in oklab, currentColor 28%, transparent); font-size: 13px;\" style-hover=\"background: color-mix(in oklab, currentColor 10%, transparent);\"><span style=\"width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid color-mix(in oklab, currentColor 55%, transparent); flex: 0 0 auto;\"><\u002Fspan>Merchant Fraud + DPP<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goDash }}\" style=\"display: flex; align-items: center; gap: 11px; text-align: left; padding: 12px 15px; border-radius: 22px; border: 1px solid color-mix(in oklab, currentColor 28%, transparent); font-size: 13px;\" style-hover=\"background: color-mix(in oklab, currentColor 10%, transparent);\"><span style=\"width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid color-mix(in oklab, currentColor 55%, transparent); flex: 0 0 auto;\"><\u002Fspan>Financial Dashboard <span style=\"font: 400 9.5px/1 'IBM Plex Mono', monospace; opacity: .6;\">wip<\u002Fspan><\u002Fbutton>\n            <button sc-camel-on-click=\"{{ showMenu }}\" style=\"align-self: flex-start; margin-top: 6px; font: 400 11px/1 'IBM Plex Mono', monospace; letter-spacing: .06em; opacity: .65; padding: 8px 0;\" style-hover=\"opacity: 1;\">← back to replies<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        \n      <\u002Faside>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ plain }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position: fixed; inset: 0; z-index: 90; background: oklch(0.972 0.006 85); overflow-y: auto;\">\n    <div style=\"max-width: 700px; margin: 0 auto; padding: clamp(28px, 5vw, 72px) clamp(20px, 4vw, 32px) 100px;\">\n      <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding-bottom: 26px; border-bottom: 1px solid oklch(0.89 0.008 80);\">\n        <div>\n          <div style=\"font-family: Fraunces, Georgia, serif; font-size: 20px; letter-spacing: -0.01em; color: oklch(0.22 0.012 70);\">Ilene (Ye Na) Kang<\u002Fdiv>\n          <div style=\"font: 400 10px/1.6 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: oklch(0.58 0.015 70); margin-top: 8px;\">UX Lead · Technical Product Design<br>Plain text version<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closePlain }}\" style=\"flex: 0 0 auto; font: 400 11px/1 'IBM Plex Mono', monospace; padding: 9px 14px; border-radius: 20px; border: 1px solid oklch(0.87 0.01 80); color: oklch(0.34 0.012 70);\" style-hover=\"background: oklch(0.95 0.008 85);\">← interactive version<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"font: 400 10px/1 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: oklch(0.58 0.015 70); margin: 40px 0 0;\">Work 01<\u002Fdiv>\n      <h2 style=\"font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 27px; line-height: 1.15; letter-spacing: -0.02em; color: oklch(0.2 0.012 70); margin: 12px 0 0;\">Merchant Fraud + Design Partner Program<\u002Fh2>\n      <p style=\"font-size: 15px; line-height: 1.7; color: oklch(0.36 0.012 70); margin: 14px 0 0; text-wrap: pretty;\">UX Lead · 2025 · Internal review console and partner program. Rebuilt merchant fraud review around the decision, then used a design partner program to pressure-test it with the teams who live in the queue.<\u002Fp>\n      <h3 style=\"font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 17px; color: oklch(0.24 0.012 70); margin: 30px 0 0;\">Problem<\u002Fh3>\n      <p style=\"font-size: 15px; line-height: 1.7; color: oklch(0.38 0.012 70); margin: 10px 0 0; text-wrap: pretty;\">Reviewers were clearing a queue, not making a decision. Signals lived in four tools, decisions were final so people escalated instead of deciding, and ops and product read the same numbers differently.<\u002Fp>\n      <h3 style=\"font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 17px; color: oklch(0.24 0.012 70); margin: 26px 0 0;\">Research<\u002Fh3>\n      <p style=\"font-size: 15px; line-height: 1.7; color: oklch(0.38 0.012 70); margin: 10px 0 0; text-wrap: pretty;\">Twelve contextual sessions, queue telemetry, and a two-week analyst diary. The finding that changed the design: reviewers did not need more data, they needed the case to tell them which signal to disbelieve first.<\u002Fp>\n      <h3 style=\"font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 17px; color: oklch(0.24 0.012 70); margin: 26px 0 0;\">Interaction model<\u002Fh3>\n      <p style=\"font-size: 15px; line-height: 1.7; color: oklch(0.38 0.012 70); margin: 10px 0 0; text-wrap: pretty;\">One case, three passes: triage, evidence, decision. The riskiest signal leads as a stated claim, evidence expands in place rather than navigating away, and the decision stays reversible for 24 hours behind an anchored decision bar.<\u002Fp>\n      <h3 style=\"font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 17px; color: oklch(0.24 0.012 70); margin: 26px 0 0;\">Design Partner Program<\u002Fh3>\n      <p style=\"font-size: 15px; line-height: 1.7; color: oklch(0.38 0.012 70); margin: 10px 0 0; text-wrap: pretty;\">Four partner teams recruited by pain, two-week build-and-watch cycles, one changelog where every change traced to a partner observation. Partners became the internal case for general availability.<\u002Fp>\n      <h3 style=\"font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 17px; color: oklch(0.24 0.012 70); margin: 26px 0 0;\">Outcome<\u002Fh3>\n      <p style=\"font-size: 15px; line-height: 1.7; color: oklch(0.38 0.012 70); margin: 10px 0 0; text-wrap: pretty;\">Faster decisions and fewer reversals; metrics are placeholders pending approval. Signal-first triage and the reversible decision both survived three new case types. Next time I would instrument the undo path from day one — it was the clearest read on reviewer confidence.<\u002Fp>\n\n      <div style=\"font: 400 10px/1 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: oklch(0.58 0.015 70); margin: 46px 0 0;\">Work 02 · in progress<\u002Fdiv>\n      <h2 style=\"font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 27px; line-height: 1.15; letter-spacing: -0.02em; color: oklch(0.2 0.012 70); margin: 12px 0 0;\">Financial Dashboard<\u002Fh2>\n      <p style=\"font-size: 15px; line-height: 1.7; color: oklch(0.36 0.012 70); margin: 14px 0 0; text-wrap: pretty;\">One view of position, exposure, and what changed since yesterday, built so the first glance answers the first question. Problem and research are drafted; the interaction model is in progress and outcome numbers are pending.<\u002Fp>\n\n      <div style=\"font: 400 10px/1 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: oklch(0.58 0.015 70); margin: 46px 0 0;\">About<\u002Fdiv>\n      <p style=\"font-size: 15px; line-height: 1.7; color: oklch(0.38 0.012 70); margin: 14px 0 0; text-wrap: pretty;\">I lead design on systems where the hard part is the decision, not the screen — risk, payments, and internal tools with real consequences. I start with the decision someone has to make, remove everything that isn't evidence for it, and ship to a few real teams before polishing for everyone. I prototype in the browser; if the interaction can't be built, it isn't a design decision yet.<\u002Fp>\n      <p style=\"font: 400 11px/1.7 'IBM Plex Mono', monospace; color: oklch(0.58 0.015 70); margin: 26px 0 0;\">[ placeholder copy throughout — real content to follow ]<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;landOn&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Merchant Fraud + DPP&quot;,&quot;Financial Dashboard&quot;],&quot;default&quot;:&quot;Merchant Fraud + DPP&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;slideTransition&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Slide&quot;,&quot;Instant&quot;],&quot;default&quot;:&quot;Slide&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;chatSurface&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Ink&quot;,&quot;Paper&quot;],&quot;default&quot;:&quot;Ink&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Presentation&quot;}}\">\nclass Component extends DCLogic {\n  projects = [\n    { id: 'fraud', num: '01', title: 'Merchant Fraud + Design Partn
